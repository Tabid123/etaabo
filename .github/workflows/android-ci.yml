name: eTaabo SMS Reader Android CI

on:
  push:
    branches: [main]
    paths:
      - "sms-reader-android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "sms-reader-android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-android@v3 currently attempts to install the removed legacy
      # package "tools"; use the SDK manager preinstalled on ubuntu-latest.
      - name: Install Android SDK Platform 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p sms-reader-android :app:assembleDebug

      - name: Run parser unit tests
        run: gradle -p sms-reader-android :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: etaabo-sms-reader-debug
          path: sms-reader-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
